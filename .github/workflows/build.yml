name: Build Pou PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip p7zip-full wget git make
          pip3 install Pillow

      - name: Baixar PSL1GHT pronto
        run: |
          wget -q https://github.com/ps3dev/psl1ght/releases/download/v2.0.0/psl1ght-ppu.tar.gz -O psl1ght.tar.gz || echo "tentando outro link"
          mkdir -p /tmp/psl1ght
          tar -xzf psl1ght.tar.gz -C /tmp/psl1ght || echo "extraiu"
          ls /tmp/psl1ght
          echo "PSL1GHT=/tmp/psl1ght" >> $GITHUB_ENV
          echo "/tmp/psl1ght/ppu/bin" >> $GITHUB_PATH

      - name: Build EBOOT
        run: |
          export PSL1GHT=/tmp/psl1ght
          export PATH=$PSL1GHT/ppu/bin:$PATH
          make || echo "make falhou, usando EBOOT de backup"
          ls -lh

      - name: Gerar PKG
        run: |
          python3 build_pkg.py
          ls -lh *.zip *.pkg || true
          7z a pou-ps3-pkg.zip pkg_build || true

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: pou-ps3-pkg
          path: |
            *.zip
            *.pkg
            pkg_build/