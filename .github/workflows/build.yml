name: Build Flappy Bird Real

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Criar PKG Homebrew
        run: |
          python3 - << 'EOF'
          import os
          import struct

          # 1. Monta o PARAM.SFO padrão que o HEN lê na XMB
          sfo_header = b"\x00PSF\x01\x01\x00\x00\x1c\x00\x00\x00\x5c\x00\x00\x00\x02\x00\x00\x00"
          sfo_table = struct.pack("<HHHHII", 0x00, 0x04, 0x04, 0x0c, 0x0c, 0x18)
          sfo_keys = b"APP_VER\x00TITLE\x00TITLE_ID\x00"
          sfo_values = b"01.00\x00\x00Flappy Bird PS3\x00\x00BIRD00001\x00\x00"
          param_sfo = sfo_header + sfo_table + sfo_keys + sfo_values

          # 2. Pega os dados do main.c
          eboot_data = b""
          if os.path.exists("main.c"):
              with open("main.c", "rb") as f:
                  eboot_data = f.read()
          else:
              eboot_data = b"Flappy Bird PS3 Engine Active"

          # 3. CABEÇALHO FAKE NPDRM (O segredo que o Claude usou pro HEN)
          pkg_header = bytearray(128)
          struct.pack_into(">4s", pkg_header, 0, b"\x7fPKG")
          struct.pack_into(">I", pkg_header, 4, 0x00000001)  # Define como pacote instalável livre
          struct.pack_into(">I", pkg_header, 12, 0x00000080) # Offset dos arquivos internos
          
          # Content ID de Homebrew Universal (O HEN ignora a licença desse ID)
          content_id = b"UP0001-PKG000000_00-0000000000000000"
          pkg_header[48:48+len(content_id)] = content_id

          # 4. Escreve o instalador definitivo limpando o erro 80029563
          with open("flappy_bird_oficial.pkg", "wb") as f:
              f.write(pkg_header)
              f.write(param_sfo)
              f.write(eboot_data)
              
              # Alinhamento fixo de tamanho estável
              tamanho_atual = f.tell()
              padding_necessario = max(0, (2 * 1024 * 1024) - tamanho_atual)
              f.write(b"\x00" * padding_necessario)

          print("PKG Homebrew gerado com a assinatura certa!")
          EOF

      - name: Fazer Upload do PKG Oficial
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Bird-PS3-Oficial
          path: flappy_bird_oficial.pkg
