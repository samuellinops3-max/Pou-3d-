name: Build_Pou_Jogo
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps3dev/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar_Jogo
        run: |
          make
          ls -lh EBOOT.BIN
      - name: Gerar_PKG
        run: |
          python3 build_pkg.py
          ls -lh POUBR001.pkg
      - name: Upload_PKG
        uses: actions/upload-artifact@v4
        with:
          name: pou-ps3-jogo
          path: POUBR001.pkg