name: Build Pou Jogo PS3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget make libgmp-dev libmpfr-dev libmpc-dev texinfo zlib1g-dev python3

      - name: Configurar PSL1GHT / Toolchain PS3
        run: |
          set -e
          git clone https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
          cd /tmp/ps3toolchain
          ./toolchain.sh || true

      - name: Compilar o Jogo
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          make

      - name: Fazer Upload do Arquivo Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Pou-PS3-Binario
          path: |
            *.elf
            *.pkg
