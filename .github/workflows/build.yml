name: Build Pou Jogo PS3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/ps3dev:latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Compilar Jogo e Gerar PKG Oficial
        run: |
          # Executa o Makefile que criamos para compilar o main.c e gerar o PKG automaticamente
          make

      - name: Fazer Upload do PKG Oficial do Pou
        uses: actions/upload-artifact@v4
        with:
          name: Pou-PS3-PKG-Pronto
          path: pou_jogo_oficial.pkg
