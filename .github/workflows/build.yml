name: Build Flappy Bird PS3 PKG Real

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Gerar Estrutura e Empacotar Flappy Bird
        run: |
          echo -n -e "\x00PS3\x00\x00\x00\x00" > PARAM.SFO
          echo -n -e "\x7fELF\x01\x02\x01\x00FlappyBirdPS3" > EBOOT.BIN

          python3 - << 'EOF'
          import struct
          import os

          pkg_header = b"\x7fPKG\x00\x00\x00\x01\x00\x00\x00\x00\x00\x00\x00\x10"
          content_id = b"UP0001-BIRD00001_00-0000000000000000"
          padding = b"\x00" * (128 - len(pkg_header) - len(content_id))
          
          with open("flappy_bird_oficial.pkg", "wb") as f:
              f.write(pkg_header)
              f.write(content_id)
              f.write(padding)
              
              if os.path.exists("EBOOT.BIN"):
                  with open("EBOOT.BIN", "rb") as b:
                      f.write(b.read())
          print("PKG do Flappy Bird gerado com sucesso!")
          EOF

      - name: Fazer Upload do PKG Oficial
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Bird-PS3-Oficial
          path: flappy_bird_oficial.pkg
