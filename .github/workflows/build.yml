name: Build Flappy Bird PS3 PKG Real

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: bucanero/ps3dev:latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Compilar e Empacotar Flappy Bird Real
        run: |
          mkdir -p pkg/USRDIR
          
          cat << 'EOF' > sfo.xml
          <?xml id="1.0" encoding="utf-8"?>
          <titleid>
            <title id="BIRD00001">Flappy Bird PS3</title>
          </titleid>
          EOF
          
          mksfoex -f sfo.xml pkg/PARAM.SFO
          ppu-gcc -O2 main.c -o pkg/USRDIR/EBOOT.BIN
          if [ -f icon0.png ]; then cp icon0.png pkg/pkg_icon0.png; fi
          make_package_npdrm pkg/ flappy_bird_oficial.pkg

      - name: Fazer Upload do PKG Legitimo
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Bird-PS3-Oficial
          path: flappy_bird_oficial.pkg
