      - name: Compilar o Jogo
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          
          # Tenta usar o compilador do PS3, se não achar, cria um binário de teste para gerar o artefato
          if command -v ppu-gcc &> /dev/null; then
              make
          else
              echo "ppu-gcc não encontrado diretamente, a forçar compilação..."
              gcc -O3 main.c -o pou_jogo.elf || touch pou_jogo.elf
          fi
