name: Build PS3 PKG

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y \
            build-essential libgmp3-dev libmpc-dev libreadline-dev \
            zlib1g-dev git wget curl python2 python3 libelf-dev sudo pkg-config
          ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup ps3toolchain
        run: |
          git clone https://github.com/bucanero/ps3toolchain.git /tmp/ps3toolchain
          export PS3DEV=/opt/ps3dev
          export PSL1GHT=/opt/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          cd /tmp/ps3toolchain
          ./toolchain.sh

      - name: Compile Cobra Arena
        run: |
          export PS3DEV=/opt/ps3dev
          export PSL1GHT=/opt/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          make

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CobraArena-PKG
          path: |
            *.pkg
