name: Build_Pou_Jogo
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar_Toolchain_PS3
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc g++ python3 wget texinfo libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev libelf-dev
          git clone https://github.com/ps3dev/ps3toolchain.git
          cd ps3toolchain
          sudo ./toolchain.sh
          echo "PS3DEV=/usr/local/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=/usr/local/ps3dev/psl1ght" >> $GITHUB_ENV
          echo "/usr/local/ps3dev/bin" >> $GITHUB_PATH
          echo "/usr/local/ps3dev/ppu/bin" >> $GITHUB_PATH
      - name: Compilar_Jogo
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=/usr/local/ps3dev/psl1ght
          export PATH=$PATH:/usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin
          make
          ls -lh EBOOT.BIN
      - name: Gerar_PKG
        run: |
          python3 build_pkg.py
          ls -lh POUBR001.pkg
      - name: Upload_PKG
        uses: actions/upload-artifact@v4
        with:
          name: pou-ps3-jogo
          path: POUBR001.pkg