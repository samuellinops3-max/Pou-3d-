name: Build Pou Jogo PS3

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget make libgmp-dev libmpfr-dev libmpc-dev texinfo zlib1g-dev

      - name: Configurar PSL1GHT / Toolchain PS3
        run: |
          # Clonar e configurar o ambiente de desenvolvimento minimalista para PS3
          git clone https://github.com/ps3dev/ps3toolchain.git /tmp/ps3toolchain
          cd /tmp/ps3toolchain
          # Usamos uma versão estável ou a padrão do toolchain
          ./toolchain.sh

      - name: Compilar o Jogo
        run: |
          # Adiciona o caminho do compilador do PS3 ao PATH
          export PS3DEV=/usr/local/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin
          
          # Executa o make para compilar o main.c e gerar os binários
          make

      - name: Gerar o Pacote PKG
        run: |
          # Aqui entram os comandos para empacotar o jogo em .pkg usando os seus arquivos (sfo.xml, etc.)
          echo "Compilação concluída com sucesso!"

      - name: Fazer Upload do Arquivo PKG
        uses: actions/upload-artifact@v4
        with:
          name: Pou-PS3-Pkg
          path: |
            *.pkg
            *.elf
